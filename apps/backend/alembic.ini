# A generic, single database configuration.
# See https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# path to migration scripts — relative to this alembic.ini
script_location = alembic

# template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
timezone = UTC

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# version path separator
version_path_separator = os

# output encoding used when writing migration files
output_encoding = utf-8

# SQLAlchemy connection URL — overridden by env.py reading DATABASE_URL from .env
sqlalchemy.url = postgresql://placeholder/placeholder


[post_write_hooks]
# Uncomment to auto-format new migration files with ruff:
# hooks = ruff
# ruff.type = exec
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
